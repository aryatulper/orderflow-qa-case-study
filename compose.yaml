services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - orderflow_data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgres://orderflow:orderflow@db:5432/orderflow
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20
volumes:
  orderflow_data:
